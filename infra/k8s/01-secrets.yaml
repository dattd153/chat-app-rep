# QUAN TRỌNG: Thay thế tất cả giá trị placeholder trước khi deploy production
# Có thể dùng: kubectl create secret generic / Helm / Sealed Secrets / External Secrets Operator
apiVersion: v1
kind: Secret
metadata:
  name: chat-app-secrets
  namespace: chat-app
type: Opaque
stringData:
  JWT_SECRET: "change-this-to-a-strong-secret-in-production"
  MONGO_URI_AUTH:         "mongodb://mongo-0.mongo:27017/auth?replicaSet=rs0"
  MONGO_URI_USER:         "mongodb://mongo-0.mongo:27017/user?replicaSet=rs0"
  MONGO_URI_CHAT:         "mongodb://mongo-0.mongo:27017/chat?replicaSet=rs0"
  MONGO_URI_MESSAGE:      "mongodb://mongo-0.mongo:27017/message?replicaSet=rs0"
  MONGO_URI_NOTIFICATION: "mongodb://mongo-0.mongo:27017/notification?replicaSet=rs0"
  REDIS_URL:    "redis://redis:6379"
  KAFKA_BROKERS: "kafka:9092"
  # Thay bằng domain thực tế (phân cách bằng dấu phẩy nếu nhiều origin)
  ALLOWED_ORIGINS: "http://your-domain.com"
