# =============================================================
# GATEWAY
# Entry point cho toàn bộ API và WebSocket
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: chat-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: <REGISTRY>/chat-app/gateway:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-app-secrets
                  key: JWT_SECRET
            - name: ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: chat-app-secrets
                  key: ALLOWED_ORIGINS
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:3000"
            - name: USER_SERVICE_URL
              value: "http://user-service:3000"
            - name: CHAT_SERVICE_URL
              value: "http://chat-service:3000"
            - name: MESSAGE_SERVICE_URL
              value: "http://message-service:3000"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:3000"
            - name: WEBSOCKET_SERVICE_URL
              value: "http://websocket-service:3000"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: chat-app
spec:
  selector:
    app: gateway
  ports:
    - port: 3000
      targetPort: 3000
  # ClientIP affinity giữ WebSocket connection về cùng 1 gateway pod
  sessionAffinity: ClientIP
---
# =============================================================
# WEB APP (React + Nginx)
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: chat-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: <REGISTRY>/chat-app/web:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: chat-app
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
