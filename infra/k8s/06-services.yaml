# Thay <REGISTRY> bằng địa chỉ container registry thực tế
# Ví dụ: docker.io/myusername  hoặc  gcr.io/my-project  hoặc  registry.gitlab.com/my-group
#
# Các service theo thứ tự dependency:
#   auth-service → user-service → chat-service → message-service
#   → websocket-service → notification-service → gateway → web

# =============================================================
# AUTH SERVICE
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: chat-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: <REGISTRY>/chat-app/auth-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-app-secrets
                  key: JWT_SECRET
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: chat-app-secrets
                  key: MONGO_URI_AUTH
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: chat-app-secrets
                  key: KAFKA_BROKERS
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: chat-app
spec:
  selector:
    app: auth-service
  ports:
    - port: 3000
      targetPort: 3000
---
