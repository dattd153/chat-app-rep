apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.4.4
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
          readinessProbe:
            exec:
              command: ["kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: chat-app
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
---
# Job tạo Kafka topics sau khi Kafka sẵn sàng
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topics
  namespace: chat-app
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: confluentinc/cp-kafka:7.4.4
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kafka..."
              until kafka-broker-api-versions --bootstrap-server kafka:9092 > /dev/null 2>&1; do sleep 5; done
              echo "Creating topics..."
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic auth-events   --replication-factor 1 --partitions 1
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic user-events   --replication-factor 1 --partitions 1
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic chat-events   --replication-factor 1 --partitions 1
              echo "Topics created:"
              kafka-topics --bootstrap-server kafka:9092 --list
